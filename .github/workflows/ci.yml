name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  atlas-core:
    name: atlas-core (Java/Maven)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Pre-pull pgvector image (used by Testcontainers)
        run: docker pull pgvector/pgvector:pg16
      - name: Build, test, and check formatting (mvn verify)
        working-directory: atlas-core
        run: ./mvnw -B verify

  atlas-ui:
    name: atlas-ui (React/Vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: atlas-ui/package-lock.json
      - working-directory: atlas-ui
        run: npm ci
      - name: Test (vitest)
        working-directory: atlas-ui
        run: npm test
      - name: Type-check and build
        working-directory: atlas-ui
        run: npm run build

  atlas-evals:
    name: atlas-evals (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true
          cache-dependency-glob: atlas-evals/uv.lock
      - working-directory: atlas-evals
        run: uv sync
      - name: Lint (ruff)
        working-directory: atlas-evals
        run: uv run ruff check .
      - name: Type-check (mypy)
        working-directory: atlas-evals
        run: uv run mypy
      - name: Test (pytest)
        working-directory: atlas-evals
        run: uv run pytest
      - name: Harness smoke eval (mock Atlas — no keys/stack)
        working-directory: atlas-evals
        run: uv run python scripts/ci_smoke.py
