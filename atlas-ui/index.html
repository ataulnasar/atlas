<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Atlas — grounded answers from EU digital regulation</title>
    <meta
      name="description"
      content="Atlas answers questions about EU digital regulation using only your ingested source documents, with inline citations you can open and verify."
    />
    <script>
      // Set the theme before first paint to avoid a flash: stored choice, else OS preference.
      (function () {
        try {
          var stored = localStorage.getItem("atlas-theme");
          if (stored === "light" || stored === "dark") {
            document.documentElement.setAttribute("data-theme", stored);
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
