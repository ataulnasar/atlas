server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Single-page app: serve index.html for any route that isn't a real file.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse-proxy the API to atlas-core (internal compose service). The browser sees one
    # same-origin host on :80, so no CORS configuration is needed anywhere.
    #
    # Resolve atlas-core at request time via Docker's embedded DNS (127.0.0.11) using a variable,
    # rather than a literal upstream that nginx resolves once at startup. This means nginx starts
    # even if atlas-core is momentarily down, and it survives atlas-core getting a new IP on
    # restart instead of caching a stale one.
    location /api/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $atlas_core atlas-core;
        proxy_pass http://$atlas_core:8080$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Chat streams answers over SSE — disable buffering and allow a long read so
        # tokens/citation events reach the browser as they are produced.
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}
