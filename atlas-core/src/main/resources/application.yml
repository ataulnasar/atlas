spring:
  application:
    name: atlas-core
  jackson:
    deserialization:
      # Reject request bodies with unknown fields (Spring Boot disables this by default). A typo'd
      # key — e.g. an unknown field inside a search `filter` — fails loudly with a 400 rather than
      # being silently ignored (which for a filter would quietly widen the search to the whole
      # corpus). Handled by DocumentExceptionHandler → 400 "invalid_request".
      fail-on-unknown-properties: true
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/atlas}
    username: ${SPRING_DATASOURCE_USERNAME:atlas}
    password: ${SPRING_DATASOURCE_PASSWORD:atlas}
  servlet:
    multipart:
      # Hard ceiling at the servlet layer; atlas.upload.max-file-size below is the
      # actual business-rule limit, enforced in code so oversize uploads get a clean
      # 413 response instead of a container-level error page.
      max-file-size: 100MB
      max-request-size: 100MB
  ai:
    openai:
      # Strictly from the environment — never a real value in this file or anywhere else in
      # the repo. Empty is fine at context-startup time (see EmbeddingConfig); only an actual
      # embed() call needs a real key.
      api-key: ${SPRING_AI_OPENAI_API_KEY:}
      embedding:
        options:
          model: text-embedding-3-small
  autoconfigure:
    exclude:
      # EmbeddingConfig builds the OpenAI embedding beans by hand instead (see its javadoc for
      # why); these auto-configurations would otherwise construct their own OpenAI-backed model
      # beans and fail application startup when no API key is configured. Only embedding is used
      # today — the other model types are excluded outright rather than left half-wired.
      - org.springframework.ai.model.openai.autoconfigure.OpenAiChatAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiEmbeddingAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiImageAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioSpeechAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioTranscriptionAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiModerationAutoConfiguration

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        # Only health is exposed. It lives at /actuator/health (outside /api/**), so the API-key
        # filter never guards it — container/orchestrator probes work without a key.
        include: health

# API authentication key is read STRICTLY from the environment (ATLAS_API_KEY) — never defaulted
# here, same discipline as spring.ai.openai.api-key. Unset/blank => auth disabled (dev/CI); a
# startup WARN makes that explicit. See ApiKeyAuthConfig / ApiKeyAuthFilter and docker/.env.example.

atlas:
  upload:
    max-file-size: 25MB
  storage:
    path: ${ATLAS_STORAGE_PATH:./data/documents}
  chunking:
    # Changing these invalidates eval comparability until the corpus is re-ingested —
    # see ChunkingProperties.
    max-tokens: 500
    overlap-tokens: 60
  parsing:
    # Line-level noise (e.g. a source's repeating page footer) to strip before chunking.
    # Empty by default — Atlas core is corpus-agnostic; a deployment supplies its own
    # patterns here or via ATLAS_PARSING_STRIP_LINE_PATTERNS. See ParsingProperties.
    strip-line-patterns: ${ATLAS_PARSING_STRIP_LINE_PATTERNS:}
  embedding:
    # Conservative relative to OpenAI's 2048-inputs-per-call limit — see EmbeddingProperties.
    batch-size: 100
    # On a provider rate limit (HTTP 429), retry a batch up to max-attempts-per-batch times,
    # waiting the provider-suggested interval when it gives one, else rate-limit-backoff.
    rate-limit-backoff: 5s
    max-attempts-per-batch: 3
  search:
    hybrid:
      # Per-source candidate pool fused by Reciprocal Rank Fusion — larger than topK so fusion has
      # material to work with. See HybridSearchProperties.
      candidate-pool: 50
      # RRF constant k in score = sum 1/(k + rank); 60 is the canonical default.
      rrf-k: 60
  generation:
    # OpenAI chat model for grounded answering — the current balanced cheap/good tier, and a value
    # Spring AI 1.1.8 recognises (OpenAiApi.ChatModel.GPT_5_MINI). See GenerationProperties.
    model: gpt-5-mini
    # Low temperature: grounded, cite-only answering wants determinism, not creativity.
    temperature: 0.1
    # Max source tokens context assembly may spend; lower-ranked chunks that don't fit are dropped.
    context-budget: 6000
    # Prior Q&A pairs replayed verbatim into the prompt.
    history-turns: 3
    cost:
      # Token prices for the approximate per-request USD cost logged with each answer. These are
      # CONFIG, NOT FETCHED — Atlas never queries a pricing API. Defaults are gpt-5-mini's published
      # standard rates as of 2025-08 (input $0.25 / 1M, output $2.00 / 1M); update by hand if the
      # model or its pricing changes.
      input-price-per-million-tokens: 0.25
      output-price-per-million-tokens: 2.00

# Logging is JSON by default (see logback-spring.xml); activate the "local" profile
# (--spring.profiles.active=local) for human-readable console output.
